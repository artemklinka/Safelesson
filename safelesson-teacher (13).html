const LECTURE={"t": ["Вставка видео и аудио в документ HTML", "HTML құжатына бейне мен аудио енгізу"], "b": ["<p>Раньше для воспроизведения звука и видео на веб-странице нужны были дополнительные плагины. В HTML5 появились теги <code>&lt;video&gt;</code> и <code>&lt;audio&gt;</code>: плеер встроен в браузер, и достаточно указать адрес файла.</p><h3>1. Тег <code>&lt;audio&gt;</code></h3><p>Тег <code>&lt;audio&gt;</code> вставляет звук: музыку, голос, подкаст. Минимальный пример:</p><pre class=\"code mono\">&lt;audio src=\"music.mp3\" controls&gt;&lt;/audio&gt;</pre><p>Атрибут <code>src</code> задаёт адрес файла, а <code>controls</code> показывает панель управления: пуск, паузу, громкость и перемотку. Без <code>controls</code> плеер на странице не виден.</p><h3>2. Тег <code>&lt;video&gt;</code></h3><p>Тег <code>&lt;video&gt;</code> работает так же, но дополнительно можно задать размер и обложку:</p><pre class=\"code mono\">&lt;video src=\"film.mp4\" width=\"640\" height=\"360\" controls poster=\"cover.jpg\"&gt;&lt;/video&gt;</pre><p>Атрибуты <code>width</code> и <code>height</code> задают размер плеера в пикселях, <code>poster</code> — картинку, которая показывается до запуска видео.</p><h3>3. Основные атрибуты</h3><ul><li><code>controls</code> — показать кнопки управления;</li><li><code>autoplay</code> — начать воспроизведение сразу после загрузки (браузеры часто блокируют автозапуск со звуком, поэтому вместе с ним добавляют <code>muted</code>);</li><li><code>loop</code> — повторять воспроизведение с начала, когда файл закончился;</li><li><code>muted</code> — выключить звук;</li><li><code>preload</code> — что загружать заранее: <code>none</code>, <code>metadata</code> или <code>auto</code>;</li><li><code>poster</code> — обложка для видео.</li></ul><h3>4. Несколько форматов: тег <code>&lt;source&gt;</code></h3><p>Не все браузеры поддерживают одни и те же форматы. Поэтому файл можно указать в нескольких тегах <code>&lt;source&gt;</code>: браузер возьмёт первый формат, который умеет воспроизводить. Атрибут <code>type</code> сообщает тип файла.</p><pre class=\"code mono\">&lt;video controls width=\"640\"&gt;\n  &lt;source src=\"film.webm\" type=\"video/webm\"&gt;\n  &lt;source src=\"film.mp4\" type=\"video/mp4\"&gt;\n  Ваш браузер не поддерживает тег video.\n&lt;/video&gt;</pre><p>Текст внутри тега — запасной: его увидит тот, чей браузер не знает тег <code>&lt;video&gt;</code>. Для звука всё устроено так же:</p><pre class=\"code mono\">&lt;audio controls&gt;\n  &lt;source src=\"music.ogg\" type=\"audio/ogg\"&gt;\n  &lt;source src=\"music.mp3\" type=\"audio/mpeg\"&gt;\n  Ваш браузер не поддерживает тег audio.\n&lt;/audio&gt;</pre><h3>5. Популярные форматы</h3><ul><li>Видео: MP4 (<code>video/mp4</code>), WebM (<code>video/webm</code>), Ogg (<code>video/ogg</code>).</li><li>Аудио: MP3 (<code>audio/mpeg</code>), WAV (<code>audio/wav</code>), Ogg (<code>audio/ogg</code>).</li><li>MP4 — самый распространённый формат видео, MP3 — аудио.</li></ul><h3>6. Видео с другого сайта: тег <code>&lt;iframe&gt;</code></h3><p>Если видео размещено на видеосервисе, например на YouTube, его вставляют через <code>&lt;iframe&gt;</code>, скопировав код вставки на странице видео:</p><pre class=\"code mono\">&lt;iframe src=\"https://www.youtube.com/embed/VIDEO_ID\" width=\"560\" height=\"315\" title=\"Название видео\" allowfullscreen&gt;&lt;/iframe&gt;</pre><h3>7. Полезные советы</h3><ul><li>Если вы не делаете свой плеер, всегда добавляйте <code>controls</code>.</li><li>Положите файлы рядом с HTML-страницей или укажите правильный путь, например <code>media/film.mp4</code>.</li><li>Не включайте автозапуск со звуком: он мешает пользователю.</li><li>Добавляйте запасной текст и, если можно, субтитры тегом <code>&lt;track&gt;</code>.</li><li>Чтобы видео не выходило за экран телефона, задайте в CSS <code>video { max-width: 100%; height: auto; }</code>.</li></ul><h3>8. Как выглядит готовый документ</h3><p>Так выглядит скелет HTML-документа с видео и аудио:</p><pre class=\"code mono\">&lt;!DOCTYPE html&gt;\n&lt;html lang=\"ru\"&gt;\n&lt;head&gt;\n  &lt;meta charset=\"utf-8\"&gt;\n  &lt;title&gt;Моя медиастраница&lt;/title&gt;\n&lt;/head&gt;\n&lt;body&gt;\n  &lt;h1&gt;Видео и аудио&lt;/h1&gt;\n  &lt;video src=\"film.mp4\" controls width=\"640\"&gt;&lt;/video&gt;\n  &lt;audio src=\"music.mp3\" controls&gt;&lt;/audio&gt;\n&lt;/body&gt;\n&lt;/html&gt;</pre><p>Порядок такой: <code>&lt;!DOCTYPE html&gt;</code>, затем <code>&lt;html&gt;</code>, в нём <code>&lt;head&gt;</code> (с <code>&lt;meta&gt;</code> и <code>&lt;title&gt;</code>) и <code>&lt;body&gt;</code> с содержимым страницы.</p>", "<p>Бұрын веб-бетте дыбыс пен бейнені ойнату үшін қосымша плагиндер қажет болатын. HTML5-те <code>&lt;video&gt;</code> және <code>&lt;audio&gt;</code> тегтері пайда болды: ойнатқыш браузерге кіріктірілген, файл мекенжайын көрсету жеткілікті.</p><h3>1. <code>&lt;audio&gt;</code> тегі</h3><p><code>&lt;audio&gt;</code> тегі дыбыс енгізеді: музыка, дауыс, подкаст. Ең қарапайым мысал:</p><pre class=\"code mono\">&lt;audio src=\"music.mp3\" controls&gt;&lt;/audio&gt;</pre><p><code>src</code> атрибуты файл мекенжайын береді, ал <code>controls</code> басқару тақтасын көрсетеді: іске қосу, үзіліс, дыбыс деңгейі және айналдыру. <code>controls</code> болмаса, ойнатқыш бетте көрінбейді.</p><h3>2. <code>&lt;video&gt;</code> тегі</h3><p><code>&lt;video&gt;</code> тегі дәл солай жұмыс істейді, бірақ қосымша өлшем мен мұқабаны көрсетуге болады:</p><pre class=\"code mono\">&lt;video src=\"film.mp4\" width=\"640\" height=\"360\" controls poster=\"cover.jpg\"&gt;&lt;/video&gt;</pre><p><code>width</code> және <code>height</code> атрибуттары ойнатқыштың өлшемін пиксельмен береді, <code>poster</code> — бейне іске қосылғанға дейін көрсетілетін сурет.</p><h3>3. Негізгі атрибуттар</h3><ul><li><code>controls</code> — басқару батырмаларын көрсету;</li><li><code>autoplay</code> — жүктелген соң ойнатуды бірден бастау (браузерлер дыбысы бар автоіске қосуды жиі бұғаттайды, сондықтан онымен бірге <code>muted</code> қосады);</li><li><code>loop</code> — файл біткен соң ойнатуды басынан қайталау;</li><li><code>muted</code> — дыбысты өшіру;</li><li><code>preload</code> — алдын ала не жүктеу керек: <code>none</code>, <code>metadata</code> немесе <code>auto</code>;</li><li><code>poster</code> — бейне мұқабасы.</li></ul><h3>4. Бірнеше формат: <code>&lt;source&gt;</code> тегі</h3><p>Барлық браузер бірдей форматтарды қолдамайды. Сондықтан файлды бірнеше <code>&lt;source&gt;</code> тегімен көрсетуге болады: браузер өзі ойната алатын бірінші форматты алады. <code>type</code> атрибуты файл түрін хабарлайды.</p><pre class=\"code mono\">&lt;video controls width=\"640\"&gt;\n  &lt;source src=\"film.webm\" type=\"video/webm\"&gt;\n  &lt;source src=\"film.mp4\" type=\"video/mp4\"&gt;\n  Браузеріңіз video тегін қолдамайды.\n&lt;/video&gt;</pre><p>Тег ішіндегі мәтін — қосалқы мәтін: оны браузері <code>&lt;video&gt;</code> тегін білмейтін адам көреді. Дыбыс үшін де бәрі солай:</p><pre class=\"code mono\">&lt;audio controls&gt;\n  &lt;source src=\"music.ogg\" type=\"audio/ogg\"&gt;\n  &lt;source src=\"music.mp3\" type=\"audio/mpeg\"&gt;\n  Браузеріңіз audio тегін қолдамайды.\n&lt;/audio&gt;</pre><h3>5. Танымал форматтар</h3><ul><li>Бейне: MP4 (<code>video/mp4</code>), WebM (<code>video/webm</code>), Ogg (<code>video/ogg</code>).</li><li>Аудио: MP3 (<code>audio/mpeg</code>), WAV (<code>audio/wav</code>), Ogg (<code>audio/ogg</code>).</li><li>MP4 — бейненің, MP3 — аудионың ең көп таралған форматы.</li></ul><h3>6. Басқа сайттағы бейне: <code>&lt;iframe&gt;</code> тегі</h3><p>Егер бейне бейнесервисте, мысалы YouTube-та орналасса, оны бейне бетіндегі кірістіру кодын көшіріп, <code>&lt;iframe&gt;</code> арқылы енгізеді:</p><pre class=\"code mono\">&lt;iframe src=\"https://www.youtube.com/embed/VIDEO_ID\" width=\"560\" height=\"315\" title=\"Бейне атауы\" allowfullscreen&gt;&lt;/iframe&gt;</pre><h3>7. Пайдалы кеңестер</h3><ul><li>Өз ойнатқышыңызды жасамасаңыз, <code>controls</code> қосуды ұмытпаңыз.</li><li>Файлдарды HTML-беттің жанына салыңыз немесе жолды дұрыс көрсетіңіз, мысалы <code>media/film.mp4</code>.</li><li>Дыбысы бар автоіске қосуды қоспаңыз: ол пайдаланушыға кедергі келтіреді.</li><li>Қосалқы мәтін қосыңыз, мүмкін болса, <code>&lt;track&gt;</code> тегімен субтитр де қосыңыз.</li><li>Бейне телефон экранынан шықпауы үшін CSS-те <code>video { max-width: 100%; height: auto; }</code> деп жазыңыз.</li></ul><h3>8. Дайын құжат қалай көрінеді</h3><p>Бейне мен аудио бар HTML құжатының қаңқасы мынадай:</p><pre class=\"code mono\">&lt;!DOCTYPE html&gt;\n&lt;html lang=\"kk\"&gt;\n&lt;head&gt;\n  &lt;meta charset=\"utf-8\"&gt;\n  &lt;title&gt;Менің медиа бетім&lt;/title&gt;\n&lt;/head&gt;\n&lt;body&gt;\n  &lt;h1&gt;Бейне және аудио&lt;/h1&gt;\n  &lt;video src=\"film.mp4\" controls width=\"640\"&gt;&lt;/video&gt;\n  &lt;audio src=\"music.mp3\" controls&gt;&lt;/audio&gt;\n&lt;/body&gt;\n&lt;/html&gt;</pre><p>Реті мынадай: <code>&lt;!DOCTYPE html&gt;</code>, содан кейін <code>&lt;html&gt;</code>, оның ішінде <code>&lt;head&gt;</code> (<code>&lt;meta&gt;</code> және <code>&lt;title&gt;</code> бар) және бет мазмұны бар <code>&lt;body&gt;</code>.</p>"], "r": ["тег <video> нужен для видео, тег <audio> для звука. Добавляйте controls, указывайте форматы через <source> и пишите запасной текст.", "<video> тегі бейне үшін, <audio> тегі дыбыс үшін. controls қосыңыз, форматтарды <source> арқылы көрсетіңіз және қосалқы мәтін жазыңыз."]};
